services:
  # ── Backend Web Service ──────────────────────────────────────────────
  - type: web
    name: salon-revenue-recovery-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: ./db/salon.db
      - key: CORS_ORIGIN
        sync: false
        # Set in Render Dashboard to your frontend URL:
        # e.g., https://salon-revenue-recovery-client.onrender.com
      - key: OPENAI_API_KEY
        sync: false
        # Set in Render Dashboard. Optional: falls back to deterministic templates if empty.
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT_MS
        value: 5000

  # ── Frontend Static Site ─────────────────────────────────────────────
  - type: static
    name: salon-revenue-recovery-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
        # Set in Render Dashboard to your backend URL:
        # e.g., https://salon-revenue-recovery-api.onrender.com
